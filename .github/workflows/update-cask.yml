name: Update the cask

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update the version and checksum
        run: python3 .github/update-cask.py
      - name: Commit when the release changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gridback.rb
          if git diff --cached --quiet; then
            echo "The cask already matches the latest release."
            exit 0
          fi
          git commit -m "Update GridBack to the latest release."
          git push
